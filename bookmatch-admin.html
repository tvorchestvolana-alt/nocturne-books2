<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BOOKMATCH · Админка</title>{admincss}</head><body><header><h1>BOOKMATCH ♡</h1><div>Управление анкетами персонажей · <a href="nocturne-admin.html">← Основная админка</a></div></header><main class="wrap"><section class="panel" id="login"><h2>Вход администратора</h2><p class="muted">Используй тот же аккаунт, что и в NOCTURNE BOOKS.</p><label>Email</label><input id="email" type="email"><label>Пароль</label><input id="password" type="password"><button id="loginBtn">Войти</button><div class="status" id="loginMsg"></div></section>
<div id="app" class="hide"><section class="panel"><div class="row"><h2>Анкеты</h2><button id="new" class="secondary">+ Новый персонаж</button><button id="logout" class="secondary">Выйти</button><a href="bookmatch.html" target="_blank">Открыть BOOKMATCH</a></div><div id="list" class="list"></div></section>
<section class="panel"><h2 id="heading">Новый персонаж</h2><div class="grid"><div><label>Имя *</label><input id="name"></div><div><label>Возраст</label><input id="age" type="number" min="18" max="120"></div><div><label>Рост, см</label><input id="height_cm" type="number" min="100" max="250"></div><div><label>Профессия</label><input id="occupation"></div><div><label>Город</label><input id="city"></div><div><label>Книга из каталога</label><select id="book_id"><option value="">Без привязки</option></select></div><div><label>Интересы (через запятую)</label><input id="interests" placeholder="Хоккей, собаки, кофе"></div><div><label>Порядок отображения</label><input id="sort_order" type="number" value="100"></div></div>
<label>Описание анкеты</label><textarea id="bio"></textarea><label>Реплика при мэтче</label><textarea id="match_line"></textarea><label>Ссылка на фото (HTTPS)</label><input id="photo_url" type="url" placeholder="https://..."><label>Или загрузить фотографию (JPG, PNG, WEBP, до 5 МБ)</label><input id="photoFile" type="file" accept="image/jpeg,image/png,image/webp"><div class="row"><label><input id="active" type="checkbox" checked style="width:auto"> Показывать анкету</label></div><div class="row"><button id="save">Сохранить анкету</button><button id="delete" class="danger">Удалить персонажа</button></div><div id="msg" class="status"></div></section></div></main>
<script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const db=createClient('https://fuogkvbinzpprvksxbql.supabase.co','sb_publishable_YVNtl0-eeUuWHF4GahBGxA_fz0dfk_T',{auth:{persistSession:true,autoRefreshToken:true}});const $=id=>document.getElementById(id);let profiles=[],current=null,verified=false;const fields=['name','age','height_cm','occupation','city','book_id','interests','sort_order','bio','match_line','photo_url','active'];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function msg(t){$('msg').textContent=t}function blank(){current=null;fields.forEach(k=>{const el=$(k);el.type==='checkbox'?el.checked=k==='active':el.value=k==='sort_order'?'100':''});$('photoFile').value='';$('heading').textContent='Новый персонаж';renderList()}
function edit(p){current=p;fields.forEach(k=>{const el=$(k);if(el.type==='checkbox')el.checked=!!p[k];else el.value=k==='interests'?(p[k]||[]).join(', '):p[k]??''});$('photoFile').value='';$('heading').textContent='Редактирование: '+p.name;renderList()}
function renderList(){$('list').innerHTML=profiles.map(p=>`<div class="item ${current?.id===p.id?'active':''}" data-id="${esc(p.id)}">${p.photo_url?`<img src="${esc(p.photo_url)}" alt="">`:''}<strong>${esc(p.name)}</strong><div class="muted">${p.active?'Активна':'Скрыта'} · ${esc(p.book_title||'Без книги')}</div></div>`).join('');$('list').querySelectorAll('[data-id]').forEach(el=>el.onclick=()=>edit(profiles.find(p=>p.id===el.dataset.id)))}
async function check(){const {data:{user}}=await db.auth.getUser();if(!user){verified=false;$('login').classList.remove('hide');$('app').classList.add('hide');return}const {data,error}=await db.from('team_admins').select('user_id').eq('user_id',user.id).maybeSingle();if(error||!data){$('loginMsg').textContent='Нет доступа: аккаунт отсутствует в team_admins';return}verified=true;$('login').classList.add('hide');$('app').classList.remove('hide');await reload()}
async function reload(){const [a,b]=await Promise.all([db.from('bookmatch_profiles').select('*').order('sort_order'),db.from('library_books').select('id,title').order('title')]);if(a.error){msg('Ошибка чтения анкет: '+a.error.message);return}profiles=a.data||[];$('book_id').innerHTML='<option value="">Без привязки</option>'+(b.data||[]).map(x=>`<option value="${esc(x.id)}">${esc(x.title)}</option>`).join('');renderList()}
$('loginBtn').onclick=async()=>{$('loginMsg').textContent='Входим…';const {error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error){$('loginMsg').textContent=error.message;return}$('password').value='';await check()};
$('logout').onclick=async()=>{await db.auth.signOut();await check()};$('new').onclick=blank;
$('save').onclick=async()=>{if(!verified)return;const name=$('name').value.trim();if(!name){msg('Укажи имя персонажа');return}const obj={};for(const k of fields){const el=$(k);obj[k]=el.type==='checkbox'?el.checked:el.value.trim()}obj.name=name;obj.age=obj.age?Number(obj.age):null;obj.height_cm=obj.height_cm?Number(obj.height_cm):null;obj.sort_order=Number(obj.sort_order)||100;obj.interests=obj.interests.split(',').map(x=>x.trim()).filter(Boolean);obj.book_id=obj.book_id||null;obj.book_title=obj.book_id?$('book_id').selectedOptions[0]?.textContent||null:null;obj.photo_url=obj.photo_url||null;if(obj.photo_url&&!/^https:\/\//i.test(obj.photo_url)){msg('Фото должно иметь ссылку HTTPS');return}msg('Сохраняем…');try{const f=$('photoFile').files[0];if(f){if(!['image/jpeg','image/png','image/webp'].includes(f.type)||f.size>5*1024*1024)throw Error('Фото: JPG/PNG/WEBP, не более 5 МБ');const ext={'image/jpeg':'jpg','image/png':'png','image/webp':'webp'}[f.type];const path=crypto.randomUUID()+'.'+ext;const {error:upErr}=await db.storage.from('bookmatch-photos').upload(path,f,{contentType:f.type,upsert:false});if(upErr)throw upErr;obj.photo_url=db.storage.from('bookmatch-photos').getPublicUrl(path).data.publicUrl}const q=current?db.from('bookmatch_profiles').update(obj).eq('id',current.id):db.from('bookmatch_profiles').insert(obj);const {data,error}=await q.select().single();if(error)throw error;await reload();edit(data);msg('Анкета сохранена ♡')}catch(e){msg('Ошибка: '+e.message)}};
$('delete').onclick=async()=>{if(!current||!verified||!confirm('Удалить анкету персонажа?'))return;const {error}=await db.from('bookmatch_profiles').delete().eq('id',current.id);if(error){msg(error.message);return}blank();await reload();msg('Анкета удалена')};await check();
</script></body></html>
