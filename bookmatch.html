<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BOOKMATCH · NOCTURNE BOOKS</title><style>
:root{font-family:Inter,Manrope,Arial,sans-serif;color:#252130;background:#f8f3f8}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer}.top{padding:17px 22px;display:flex;justify-content:space-between;align-items:center;gap:12px;background:#fff;border-bottom:1px solid #f0e3ec}.top a{color:#ae5787;text-decoration:none;font-weight:700}.top b{letter-spacing:2px}.layout{min-height:calc(100vh - 66px);display:grid;place-items:center;padding:28px 14px;background:radial-gradient(ellipse at 20% 20%,#f4d8e7,transparent 55%),linear-gradient(135deg,#fff8fb,#e8eaf5)}.phone{width:min(100%,390px);background:#171722;border:9px solid #171722;border-radius:44px;padding:5px;box-shadow:0 28px 65px #39304b3b;overflow:hidden}.screen{height:min(740px,78vh);min-height:550px;background:#fffafb;border-radius:31px;display:flex;flex-direction:column;overflow:hidden}.island{background:#171722;width:100px;height:19px;border-radius:0 0 15px 15px;margin:0 auto 8px;flex-shrink:0}.apphead{display:flex;justify-content:space-between;align-items:center;padding:9px 19px 15px;color:#c3568b;font-weight:900;font-size:23px}.apphead small{font-size:11px;font-weight:600;color:#9e8393}.stage{flex:1;min-height:0;padding:0 13px;display:flex;flex-direction:column}.profile{position:relative;flex:1;min-height:0;border-radius:20px;overflow:hidden;background:linear-gradient(160deg,#947e95,#282634);box-shadow:0 6px 20px #2b263222;touch-action:pan-y;user-select:none;transition:transform .18s ease,opacity .18s ease}.profile img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}.shade{position:absolute;inset:20% 0 0;background:linear-gradient(transparent 20%,#0b0812e8)}.info{position:absolute;bottom:0;color:white;padding:20px 18px;width:100%;max-height:75%;overflow:auto}.info h2{font-size:26px;margin:0 0 7px}.info p{margin:7px 0;line-height:1.4;font-size:13px}.chips{display:flex;flex-wrap:wrap;gap:5px;margin:10px 0}.chip{font-size:11px;border-radius:50px;padding:5px 8px;background:#ffffff30;backdrop-filter:blur(5px)}.muted{color:#f1dbe8}.controls{display:flex;justify-content:center;gap:36px;padding:14px}.round{width:59px;height:59px;border-radius:50%;border:1px solid #ecd6e1;background:white;font-size:29px;box-shadow:0 4px 13px #2b263214}.round.no{color:#766b84}.round.yes{color:#dc5b91}.tabs{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid #f0dfe8;background:white}.tabs button{border:0;background:white;padding:12px 0;color:#927f90;font-weight:700}.tabs button.active{color:#c74e89;background:#fff1f7}.empty{margin:auto;text-align:center;color:#8a7284;max-width:260px;line-height:1.5}.empty strong{display:block;color:#413247;margin:10px 0}.matchgrid{overflow:auto;display:grid;grid-template-columns:1fr 1fr;align-content:start;gap:10px}.matchcard{border:0;border-radius:14px;overflow:hidden;background:white;box-shadow:0 3px 10px #39233715;text-align:left;padding:0}.matchcard img{width:100%;height:150px;object-fit:cover;background:#e8d4e3}.matchcard span{display:block;padding:9px;font-weight:700;font-size:13px}.overlay{position:fixed;inset:0;background:#1d1024bb;display:grid;place-items:center;padding:20px;z-index:100}.overlay[hidden]{display:none}.popup{background:white;border-radius:24px;padding:24px;width:min(100%,360px);text-align:center;box-shadow:0 18px 60px #0005}.popup h2{color:#c34d88;font-size:29px;margin:10px 0}.popup img{width:160px;height:190px;object-fit:cover;border-radius:18px;background:#f0dce6}.primary{background:#c4568d;color:white;border:0;border-radius:50px;padding:13px 22px;font-weight:800}.notice{padding:10px;text-align:center;font-size:12px;color:#93627c}.notice:empty{display:none}@media(max-width:500px){.layout{padding:0;background:#fffafb;min-height:calc(100dvh - 53px)}.phone{border:0;border-radius:0;width:100%;box-shadow:none;padding:0;background:white}.screen{height:calc(100dvh - 53px);min-height:470px;border-radius:0}.island{display:none}.top{padding:13px}.apphead{padding-top:16px}
</style><style id="bookmatch-embed-style">html:has(body.bookmatch-embed),body.bookmatch-embed{height:100%;overflow:hidden}body.bookmatch-embed .top{display:none}body.bookmatch-embed .layout{min-height:0;height:100%;padding:0;background:#fffafb;display:block}body.bookmatch-embed .phone{width:100%;height:100%;border:0;border-radius:0;padding:0;box-shadow:none;background:#fffafb}body.bookmatch-embed .screen{height:100%;min-height:0;border-radius:0}body.bookmatch-embed .island{display:none}body.bookmatch-embed .apphead{padding:10px 12px;font-size:18px}body.bookmatch-embed .apphead small{font-size:9px}body.bookmatch-embed .stage{padding:0 9px}body.bookmatch-embed .profile{border-radius:13px}body.bookmatch-embed .controls{padding:6px 0}body.bookmatch-embed .round{width:44px;height:44px}body.bookmatch-embed .overlay{position:fixed}</style><script>if(new URLSearchParams(location.search).get('embed')==='1')document.addEventListener('DOMContentLoaded',()=>document.body.classList.add('bookmatch-embed'));</script></head><body>
<header class="top"><b>NOCTURNE BOOKS ♡</b><a href="index.html">← В библиотеку</a></header>
<main class="layout"><div class="phone"><div class="screen"><div class="island"></div><div class="apphead"><span>♥ bookmatch</span><small>КНИЖНЫЕ ЗНАКОМСТВА</small></div><div class="stage" id="stage"><div class="empty">Загружаем анкеты…</div></div><div id="notice" class="notice"></div><nav class="tabs"><button id="discover" class="active">♡ Знакомства</button><button id="liked">♥ Мои мэтчи <span id="count"></span></button></nav></div></div></main>
<div class="overlay" id="overlay" hidden><div class="popup"><div style="font-size:25px">💕</div><h2>IT'S A MATCH!</h2><img id="matchPhoto" alt="Портрет персонажа"><h3 id="matchName"></h3><p id="matchLine"></p><button class="primary" id="continue">Продолжить знакомство ♡</button></div></div>
<script>
const BASE='https://fuogkvbinzpprvksxbql.supabase.co',KEY='sb_publishable_YVNtl0-eeUuWHF4GahBGxA_fz0dfk_T';const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let profiles=[],page='discover',index=0;const STORE='nocturne-bookmatch-v1';let seen={},liked={};
try{const x=JSON.parse(localStorage.getItem(STORE)||'{}');seen=x.seen||{};liked=x.liked||{}}catch{}
function save(){try{localStorage.setItem(STORE,JSON.stringify({seen,liked}))}catch{$('notice').textContent='Браузер не разрешает сохранять симпатии'}}
function safeImage(url){try{const u=new URL(url);return ['https:','http:'].includes(u.protocol)?u.href:''}catch{return ''}}
function img(p){return safeImage(p.photo_url)||''}
function imageHTML(p){return img(p)?`<img src="${esc(img(p))}" alt="Портрет ${esc(p.name)}" loading="lazy">`:'<div style="height:100%;display:grid;place-items:center;font-size:65px;color:white">♡</div>'}
function current(){return profiles.find(p=>!seen[p.id])}
function render(){$('count').textContent=Object.keys(liked).length||'';$('discover').classList.toggle('active',page==='discover');$('liked').classList.toggle('active',page==='liked');const s=$('stage');s.innerHTML='';
if(page==='liked'){const arr=profiles.filter(p=>liked[p.id]);if(!arr.length){s.innerHTML='<div class="empty"><div style="font-size:40px">♡</div><strong>Здесь пока пусто</strong>Лайкай персонажей, и они появятся здесь.</div>';return}const grid=document.createElement('div');grid.className='matchgrid';arr.forEach(p=>{const b=document.createElement('button');b.className='matchcard';b.innerHTML=imageHTML(p)+`<span>${esc(p.name)}${p.age?', '+esc(p.age):''}</span>`;b.onclick=()=>showMatch(p,false);grid.append(b)});s.append(grid);return}
const p=current();if(!p){s.innerHTML='<div class="empty"><div style="font-size:45px">💗</div><strong>Все анкеты просмотрены!</strong>Новые персонажи появятся здесь, когда их добавят в библиотеку.</div>';return}
const card=document.createElement('article');card.className='profile';card.innerHTML=imageHTML(p)+`<div class="shade"></div><div class="info"><h2>${esc(p.name)}${p.age?', '+esc(p.age):''}</h2><p class="muted">${esc([p.occupation,p.city,p.height_cm?p.height_cm+' см':''].filter(Boolean).join(' · '))}</p><div class="chips">${(p.interests||[]).map(t=>`<span class="chip">${esc(t)}</span>`).join('')}</div><p>${esc(p.bio)}</p>${p.book_title?`<p class="muted">📖 ${esc(p.book_title)}</p>`:''}</div>`;
let x=0,y=0;card.addEventListener('pointerdown',e=>{x=e.clientX;y=e.clientY;card.setPointerCapture(e.pointerId)});card.addEventListener('pointerup',e=>{const dx=e.clientX-x;if(Math.abs(dx)>75&&Math.abs(e.clientY-y)<150)vote(p,dx>0)});s.append(card);
const controls=document.createElement('div');controls.className='controls';controls.innerHTML='<button class="round no" aria-label="Пропустить">✕</button><button class="round yes" aria-label="Нравится">♥</button>';controls.children[0].onclick=()=>vote(p,false);controls.children[1].onclick=()=>vote(p,true);s.append(controls)
}
function vote(p,yes){seen[p.id]=true;if(yes)liked[p.id]=true;save();render();if(yes)showMatch(p,true)}
function showMatch(p,first){$('matchPhoto').src=img(p)||'';$('matchPhoto').style.display=img(p)?'inline-block':'none';$('matchName').textContent=p.name;$('matchLine').textContent=first?(p.match_line||'Кажется, это взаимно ♡'):(p.bio||'Твой книжный мэтч ♡');$('overlay').hidden=false}
$('continue').onclick=()=>$('overlay').hidden=true;$('overlay').addEventListener('click',e=>{if(e.target===$('overlay'))$('overlay').hidden=true});$('discover').onclick=()=>{page='discover';render()};$('liked').onclick=()=>{page='liked';render()};
async function load(){try{const r=await fetch(BASE+'/rest/v1/bookmatch_profiles?select=*&active=eq.true&order=sort_order.asc,created_at.asc',{headers:{apikey:KEY,Authorization:'Bearer '+KEY}});if(!r.ok)throw Error('HTTP '+r.status);profiles=await r.json();render()}catch(e){$('stage').innerHTML='<div class="empty"><strong>Анкеты пока недоступны</strong>Проверь подключение BOOKMATCH к Supabase.</div>';$('notice').textContent='Ошибка загрузки: '+e.message}}
load();
</script></body></html>
